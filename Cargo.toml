[package]
name = "lianlite"
version = "0.6.0"
edition = "2021"

[dependencies]
eframe = "0.29"
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
semver = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
