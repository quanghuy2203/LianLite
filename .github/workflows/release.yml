name: Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Only the latest main-branch commit needs a Windows build/release.
concurrency:
  group: lianlite-windows-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native driver safety tests
        shell: pwsh
        run: cargo test --bins
      - name: Build
        shell: pwsh
        run: cargo build --release --bins
      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/lianlite.exe -DestinationPath dist/lianlite-windows-x64.zip
          Copy-Item target/release/lianlite-updater.exe dist/lianlite-updater.exe
          Compress-Archive -Path target/release/lianlite.exe,target/release/lianlite-updater.exe -DestinationPath dist/LianLite-Portable-Windows-x64.zip
          $hash = (Get-FileHash dist/lianlite-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lianlite-windows-x64.zip" | Set-Content -Encoding ascii dist/lianlite-windows-x64.zip.sha256
          $portableHash = (Get-FileHash dist/LianLite-Portable-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  LianLite-Portable-Windows-x64.zip" | Set-Content -Encoding ascii dist/LianLite-Portable-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LianLite-Windows
          path: dist/*
      - name: Auto publish NEW version only (same build, no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$'
          if (-not $match) { throw 'Cargo.toml semver version is missing' }
          $tag = 'v' + $match.Matches[0].Groups[1].Value
          $repo = '${{ github.repository }}'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Skip to avoid overwriting an existing published version."
            exit 0
          }
          $assets = @(
            'dist/lianlite-windows-x64.zip',
            'dist/lianlite-windows-x64.zip.sha256',
            'dist/lianlite-updater.exe',
            'dist/LianLite-Portable-Windows-x64.zip',
            'dist/LianLite-Portable-Windows-x64.zip.sha256'
          )
          gh release create $tag $assets --target '${{ github.sha }}' --title $tag --generate-notes --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $tag" }
