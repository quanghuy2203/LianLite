name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: pwsh
        run: cargo build --release --bins
      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/lianlite.exe -DestinationPath dist/lianlite-windows-x64.zip
          Copy-Item target/release/lianlite-updater.exe dist/lianlite-updater.exe
          $hash = (Get-FileHash dist/lianlite-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lianlite-windows-x64.zip" | Set-Content -Encoding ascii dist/lianlite-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LianLite-Windows
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/lianlite-windows-x64.zip dist/lianlite-windows-x64.zip.sha256 dist/lianlite-updater.exe --title "${{ github.ref_name }}" --generate-notes
