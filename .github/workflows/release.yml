name: Windows release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release after successful tests/build'
        type: boolean
        default: false
        required: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native driver safety tests
        shell: pwsh
        run: cargo test --bins
      - name: Build
        shell: pwsh
        run: cargo build --release --bins
      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/lianlite.exe -DestinationPath dist/lianlite-windows-x64.zip
          Copy-Item target/release/lianlite-updater.exe dist/lianlite-updater.exe
          # Portable first-install bundle: both executables together.
          Compress-Archive -Path target/release/lianlite.exe,target/release/lianlite-updater.exe -DestinationPath dist/LianLite-Portable-Windows-x64.zip
          $hash = (Get-FileHash dist/lianlite-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lianlite-windows-x64.zip" | Set-Content -Encoding ascii dist/lianlite-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LianLite-Windows
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$'
          if (-not $match) { throw "Cargo.toml version missing" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) {
            throw "Tag does not match Cargo.toml version"
          }
          $files = @('dist/lianlite-windows-x64.zip', 'dist/lianlite-windows-x64.zip.sha256', 'dist/lianlite-updater.exe', 'dist/LianLite-Portable-Windows-x64.zip')
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $tag $files --target '${{ github.sha }}' --title $tag --generate-notes --repo '${{ github.repository }}'
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag" }
